name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag della release (es. v1.0.0) - Lascia vuoto per usare la versione di gradle.properties'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Version & Tag
        id: version_check
        run: |
          if [ -n "${{ inputs.tag_name }}" ]; then
            RAW_VER="${{ inputs.tag_name }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            RAW_VER="${{ github.ref_name }}"
          else
            RAW_VER=$(grep "^mod_version=" gradle.properties | cut -d'=' -f2 | tr -d '\r' | tr -d ' ')
          fi

          if [[ "$RAW_VER" =~ ^v ]]; then
            TAG="$RAW_VER"
          else
            TAG="v$RAW_VER"
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Target tag: $TAG"

          EXISTS=false
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            EXISTS=true
            echo "Release $TAG esiste già su GitHub."
          elif gh api "repos/${{ github.repository }}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            EXISTS=true
            echo "Il tag $TAG esiste già sul repository."
          fi

          echo "exists=$EXISTS" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Skip notification if release already exists
        if: steps.version_check.outputs.exists == 'true' && github.event_name != 'workflow_dispatch'
        run: |
          echo "La versione ${{ steps.version_check.outputs.tag }} esiste già."
          echo "Nessuna nuova release creata. Per rilasciare una nuova versione, incrementa 'mod_version' in gradle.properties."

      - name: Setup JDK 25
        if: steps.version_check.outputs.exists == 'false' || github.event_name == 'workflow_dispatch'
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        if: steps.version_check.outputs.exists == 'false' || github.event_name == 'workflow_dispatch'
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        if: steps.version_check.outputs.exists == 'false' || github.event_name == 'workflow_dispatch'
        run: chmod +x ./gradlew

      - name: Build mod with Gradle
        if: steps.version_check.outputs.exists == 'false' || github.event_name == 'workflow_dispatch'
        run: ./gradlew build

      - name: Check built JARs
        if: steps.version_check.outputs.exists == 'false' || github.event_name == 'workflow_dispatch'
        run: ls -la build/libs/

      - name: Upload JAR to GitHub Release
        if: steps.version_check.outputs.exists == 'false' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version_check.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: "Release ${{ steps.version_check.outputs.tag }}"
          generate_release_notes: true
          files: build/libs/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
